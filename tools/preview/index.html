<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>名堂 · 小程序 Web 预览</title>
<style>
  :root {
    --bg: #F2F1EE;
    --panel: #FFFFFF;
    --ink: #16181A;
    --ink-2: #4A4F55;
    --ink-3: #8A9099;
    --line: #E4E2DD;
    --cinnabar: #A6321F;
    --frame-w: 390px;
    --rpx: 0.52px; /* 390 / 750 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header .brand { font-weight: 600; letter-spacing: .5px; }
  header .brand small { font-weight: 400; color: var(--ink-3); margin-left: 6px; }
  header .grow { flex: 1; }

  select, button.ctl {
    font: inherit; color: var(--ink-2); background: #fff;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 5px 10px; cursor: pointer;
  }
  button.ctl:hover { border-color: var(--ink-3); }
  button.ctl.primary { background: var(--ink); color: #fff; border-color: var(--ink); }

  main { flex: 1; display: flex; min-height: 0; }

  .stage {
    flex: 1; display: flex; align-items: flex-start; justify-content: center;
    padding: 18px; overflow: auto; gap: 18px;
  }

  /* 手机壳 */
  .phone {
    width: var(--frame-w); flex: 0 0 auto;
    background: #fff; border: 1px solid #D7D4CE; border-radius: 14px;
    overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.07);
    display: flex; flex-direction: column;
  }
  .navbar {
    height: 42px; flex: 0 0 auto; display: flex; align-items: center;
    padding: 0 12px; gap: 8px;
    background: #F7F6F3; border-bottom: 1px solid var(--line);
    font-size: 14px; color: var(--ink);
  }
  .navbar .back {
    cursor: pointer; color: var(--ink-3); font-size: 18px; line-height: 1;
    padding: 2px 6px; border-radius: 3px;
  }
  .navbar .back:hover { background: #EDEBE6; color: var(--ink); }
  .navbar .title { flex: 1; text-align: center; font-family: "Songti SC", serif; letter-spacing: 1px; }
  .navbar .badge { font-size: 11px; color: var(--ink-3); }

  .screen {
    height: 760px; overflow: hidden; overflow-x: hidden;
    background: #F7F6F3; position: relative;
    /* 关键：给 .screen 一个 transform，让它成为 position:fixed 后代的包含块。
       不加这行，页面里的 fixed 弹层会相对**整个浏览器窗口**定位 —— 日期选择器
       会铺满预览区（真机上只有设备宽），用户看着就是「点了没反应 / 页面坏了」。
       滚动随之交给里面的 .wb-page-root，这样 fixed 弹层既在手机壳内、又不随内容滚。 */
    transform: translateZ(0);
  }

  /* 名堂页面根：承接 app.wxss 里的 page 选择器，同时是手机壳里的滚动视口 */
  .wb-page-root {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
  }

  /* 小程序基础组件在浏览器里的默认显示形态（其余样式一律来自 wxss） */
  view, scroll-view, swiper, picker, form, navigator, cover-view { display: block; }
  text { display: inline; }
  scroll-view { overflow: hidden; }
  scroll-view[scroll-x] { overflow-x: auto; overflow-y: hidden; }
  scroll-view[scroll-y] { overflow-y: auto; }
  img { display: block; max-width: 100%; }
  input { border: 0; outline: 0; background: transparent; font: inherit; color: inherit; width: 100%; padding: 0; }
  button { font: inherit; }
  picker { cursor: pointer; }
  .wb-switch {
    display: inline-block; width: 80rpx; height: 46rpx; border-radius: 23rpx;
    background: #D8D5CF; position: relative; vertical-align: middle;
    transition: background .15s; cursor: pointer;
  }
  .wb-switch-on { background: #4E6B54; }
  .wb-switch i {
    position: absolute; top: 4rpx; left: 4rpx; width: 38rpx; height: 38rpx;
    border-radius: 50%; background: #fff; transition: left .15s;
  }
  .wb-switch-on i { left: 38rpx; }

  /* 侧栏 */
  aside {
    width: 320px; flex: 0 0 auto; background: var(--panel);
    border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  }
  aside h3 {
    margin: 0; padding: 10px 14px; font-size: 12px; font-weight: 600;
    color: var(--ink-3); letter-spacing: 1px; border-bottom: 1px solid var(--line);
  }
  #logs { flex: 1; overflow: auto; padding: 8px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.6; }
  #logs div { padding: 2px 0; border-bottom: 1px dashed #F0EEEA; word-break: break-all; }
  #logs .warn { color: #9A6A16; }
  #logs .error { color: var(--cinnabar); }
  #logs .info { color: var(--ink-3); }

  /* toast / 弹层 */
  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: rgba(22,24,26,.9); color: #fff; padding: 9px 16px; border-radius: 4px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 70%;
  }
  #toast.on { opacity: 1; }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.28);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .modal-mask.on { display: flex; }
  .modal {
    background: #fff; border-radius: 6px; padding: 16px; width: 300px;
    border: 1px solid var(--line);
  }
  .modal .modal-title { font-size: 13px; color: var(--ink-3); margin-bottom: 10px; }
  .modal select, .modal input[type=date] {
    width: 100%; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 3px;
  }
  .modal .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .modal .modal-actions button { flex: 1; }

  /* wx.showModal 的浏览器替身（与 picker 替身共用遮罩样式，各自一套 DOM） */
  .confirm-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.28);
    display: none; align-items: center; justify-content: center; z-index: 60;
  }
  .confirm-mask.on { display: flex; }
  .confirm-body { font-size: 13px; color: var(--ink); line-height: 1.6; margin-top: 8px; }

  .hint { color: var(--ink-3); font-size: 12px; padding: 0 14px 12px; }
</style>
</head>
<body>
<header>
  <div class="brand">名堂 · 小程序 Web 预览<small>读的是 miniprogram/ 原始文件</small></div>
  <label>页面
    <select id="page-picker"></select>
  </label>
  <button class="ctl" id="btn-reload">重载当前页</button>
  <button class="ctl" id="btn-restart">回到首页</button>
  <button class="ctl" id="btn-flow">跑通起名流程</button>
  <div class="grow"></div>
  <button class="ctl primary" id="btn-logs">日志</button>
</header>

<main>
  <div class="stage">
    <div class="phone">
      <div class="navbar">
        <span class="back" id="nav-back">‹</span>
        <span class="title" id="nav-title">名堂</span>
        <span class="badge" id="nav-path"></span>
      </div>
      <div class="screen"><div class="wb-page-root" id="mount"></div></div>
    </div>
  </div>
  <aside id="sidebar">
    <h3>运行日志（含未实现的 wx.* 调用）</h3>
    <div id="logs"></div>
    <div class="hint">点页面里的东西就能交互：筛选、换一批、跳转、分享都会走真实逻辑与真实后端。</div>
  </aside>
</main>

<div id="toast"></div>

<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="ctl" id="modal-cancel">取消</button>
      <button class="ctl primary" id="modal-ok">确定</button>
    </div>
  </div>
</div>

<div class="confirm-mask" id="confirm-mask">
  <div class="modal">
    <div class="modal-title" id="confirm-title"></div>
    <div class="confirm-body" id="confirm-content"></div>
    <div class="modal-actions">
      <button class="ctl" id="confirm-cancel">取消</button>
      <button class="ctl primary" id="confirm-ok">确定</button>
    </div>
  </div>
</div>

<script src="/runner.js"></script>
<script type="application/json" id="wb-report">{}</script>
<script>
(function () {
  var mount = document.getElementById('mount')
  var logsEl = document.getElementById('logs')
  var toastEl = document.getElementById('toast')
  var pagePicker = document.getElementById('page-picker')
  var navTitle = document.getElementById('nav-title')
  var navPath = document.getElementById('nav-path')
  var navBack = document.getElementById('nav-back')

  var APP_NAME = '名堂'
  var currentInstance = null
  var currentPath = ''
  var pickerCtx = null

  // ── 自检：把面板日志 + 未捕获错误汇总成机器可读报告 ──
  // 目的：让「预览到底跑没跑起来」可以不用肉眼判断（node tools/preview/probe.js 读它）
  var panel = []
  var runtimeErrors = []
  var panelMark = 0 // 报告只覆盖「本次进入页面之后」的日志，避免上一页的报错串台

  function writeReport(extra) {
    var el = document.getElementById('wb-report')
    if (!el) return
    var base = {
      page: currentPath,
      panelFrom: panelMark,
      panel: panel.slice(panelMark),
      errors: runtimeErrors
    }
    if (extra) for (var k in extra) base[k] = extra[k]
    el.textContent = JSON.stringify(base, null, 0)
  }

  function log(msg, type) {
    panel.push({ level: type || 'info', text: String(msg) })
    var d = document.createElement('div')
    d.className = type || 'info'
    d.textContent = msg
    logsEl.appendChild(d)
    logsEl.scrollTop = logsEl.scrollHeight
    writeReport()
  }

  window.addEventListener('error', function (e) {
    runtimeErrors.push('onerror: ' + (e.message || '') + ' @' + (e.filename || '') + ':' + (e.lineno || 0))
    log('未捕获异常：' + (e.message || e.type), 'error')
  })
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason
    runtimeErrors.push('unhandledrejection: ' + ((r && (r.message || r)) || ''))
    log('未处理的 Promise 拒绝：' + ((r && (r.message || r)) || ''), 'error')
  })
  ;['error', 'warn'].forEach(function (lvl) {
    var orig = console[lvl].bind(console)
    console[lvl] = function () {
      var parts = Array.prototype.map.call(arguments, function (a) {
        return a && a.message ? a.message : String(a)
      })
      if (lvl === 'error') runtimeErrors.push('console.error: ' + parts.join(' '))
      log('console.' + lvl + ': ' + parts.join(' '), lvl === 'error' ? 'error' : 'warn')
      orig.apply(null, arguments)
    }
  })

  var toastTimer = null
  function toast(msg) {
    toastEl.textContent = msg
    toastEl.classList.add('on')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(function () { toastEl.classList.remove('on') }, 1800)
  }

  // ── 原生 picker 替身 ──
  function openPicker(el, cb) {
    var mode = el.getAttribute('data-mp-picker') || 'selector'
    var rawRange = el.getAttribute('data-mp-range')
    var rangeKey = el.getAttribute('data-mp-range-key')
    var curValue = el.getAttribute('data-mp-value')
    var range = []
    try { range = rawRange ? JSON.parse(decodeURIComponent(rawRange)) : [] } catch (e) { range = [] }

    var body = document.getElementById('modal-body')
    var titleText = mode === 'date'
      ? '选择日期（点击输入框，选好后按确定）'
      : mode === 'time'
        ? '选择时间'
        : '选择一项'
    document.getElementById('modal-title').textContent = titleText
    body.innerHTML = ''

    var input
    if (mode === 'date' || mode === 'time') {
      input = document.createElement('input')
      input.type = mode
      input.value = curValue || ''
      // 浏览器日期输入框形态不一，加一行提示避免用户看不到入口
      var hint = document.createElement('p')
      hint.className = 'hint'
      hint.textContent = '点击上方日期框，在弹出的日历里选择后按「确定」。'
    } else {
      input = document.createElement('select')
      range.forEach(function (item, idx) {
        var label = (rangeKey && item && typeof item === 'object') ? item[rangeKey] : item
        var opt = document.createElement('option')
        opt.value = idx
        opt.textContent = label
        input.appendChild(opt)
      })
      if (curValue !== null && curValue !== '') input.value = curValue
    }
    body.appendChild(input)
    if (hint) body.appendChild(hint)

    pickerCtx = { el: el, cb: cb, input: input, mode: mode }
    document.getElementById('modal-mask').classList.add('on')
  }

  function closePicker() {
    document.getElementById('modal-mask').classList.remove('on')
    pickerCtx = null
  }

  document.getElementById('modal-cancel').onclick = closePicker
  document.getElementById('modal-ok').onclick = function () {
    var ctx = pickerCtx
    if (!ctx) return
    var value = ctx.mode === 'date' || ctx.mode === 'time'
      ? ctx.input.value
      : Number(ctx.input.value)
    closePicker()
    ctx.cb(value)
  }

  // ── wx.showModal 替身 ──
  // 自动化跑流程时不能让弹窗把脚本卡住，故留一个「预设答案」开关：
  //   window.__wb.setModalAnswer(true)  → 之后所有 showModal 立刻按「确定」返回
  //   window.__wb.setModalAnswer(false) → 立刻按「取消」返回
  //   window.__wb.setModalAnswer(null)  → 恢复真人点击（默认）
  var modalAnswer = null
  var confirmCtx = null

  function openConfirm(opts, cb) {
    confirmCtx = cb
    document.getElementById('confirm-title').textContent = opts.title || '提示'
    document.getElementById('confirm-content').textContent = opts.content || ''
    document.getElementById('confirm-ok').textContent = opts.confirmText || '确定'
    document.getElementById('confirm-cancel').textContent = opts.cancelText || '取消'
    document.getElementById('confirm-mask').classList.add('on')
  }

  function closeConfirm() {
    document.getElementById('confirm-mask').classList.remove('on')
  }

  function showModal(opts, cb) {
    var o = opts || {}
    if (o.showCancel === false) o.cancelText = ''
    if (modalAnswer !== null) {
      setTimeout(function () {
        cb({ confirm: !!modalAnswer, cancel: !modalAnswer })
      }, 0)
      return
    }
    openConfirm(o, cb)
  }

  document.getElementById('confirm-cancel').onclick = function () {
    var cb = confirmCtx
    confirmCtx = null
    closeConfirm()
    cb && cb({ confirm: false, cancel: true })
  }
  document.getElementById('confirm-ok').onclick = function () {
    var cb = confirmCtx
    confirmCtx = null
    closeConfirm()
    cb && cb({ confirm: true, cancel: false })
  }

  // ── 事件委托 ──
  function fire(evIndex, domEvent, detail) {
    if (currentInstance && currentInstance.__fire) {
      currentInstance.__fire(evIndex, domEvent, detail)
    }
  }

  /**
   * 取某个 data-wb-ev 编号对应的「小程序事件类型」（tap / input / change / longpress）。
   * 必须做这层查表：data-wb-ev 只表示「这个元素挂了某个事件」，**不代表它是点击**。
   * 反例见下面 click 监听里的注释。
   */
  function evTypeOf(idx) {
    var cur = runtime && runtime.current
    if (!cur || !cur.events || cur.instance !== currentInstance) return null
    var ev = cur.events[idx]
    return ev ? ev.type : null
  }

  mount.addEventListener('click', function (e) {
    var el = e.target.closest('[data-wb-ev]')
    if (!el) return
    var idx = Number(el.getAttribute('data-wb-ev'))
    var tag = el.tagName.toLowerCase()

    if (el.classList.contains('wb-switch')) {
      fire(idx, { currentTarget: el }, { value: !el.classList.contains('wb-switch-on') })
      return
    }
    if (tag === 'picker') {
      openPicker(el, function (value) { fire(idx, { currentTarget: el }, { value: value }) })
      return
    }

    // 只有 tap / longpress 才该被「点击」触发。
    // 反例：<input bindinput="onSurnameInput"> 也带 data-wb-ev，旧代码点击就派发，
    //   detail 是 {}，页面里 e.detail.value === undefined → setData({surname: undefined})
    //   → 整页重绘 → 输入框被换掉 → 点一下就失焦，用户永远打不进姓氏。
    var t = evTypeOf(idx)
    if (t && t !== 'tap' && t !== 'longpress') return
    fire(idx, { currentTarget: el }, {})
  })

  mount.addEventListener('input', function (e) {
    var el = e.target.closest('[data-wb-ev]')
    if (!el) return
    var idx = Number(el.getAttribute('data-wb-ev'))
    var t = evTypeOf(idx)
    if (t && t !== 'input') return
    fire(idx, { currentTarget: el }, { value: e.target.value })
  })

  mount.addEventListener('change', function (e) {
    var el = e.target.closest('[data-wb-ev]')
    if (!el) return
    var idx = Number(el.getAttribute('data-wb-ev'))
    var t = evTypeOf(idx)
    if (t && t !== 'change') return
    fire(idx, { currentTarget: el }, { value: e.target.value })
  })

  // ── 增量挂载（morph）────────────────────────────────────────────
  /**
   * 为什么不直接 `mount.innerHTML = html`：
   * 每次 setData 都重建整棵 DOM，会把**正在输入的 input 一起干掉** ——
   * 编辑器（IME）的组字状态挂在那个 DOM 节点上，节点一换，组字中断，
   * 表现就是「中文一个字都打不进去」。顺带还会丢滚动位置、丢文本选区。
   *
   * 所以改成按位置对齐的增量补丁：同标签就地改属性/递归，不同标签才替换。
   * 对**当前获得焦点的输入框**额外跳过 value 属性 —— 它由浏览器持有，
   * 中途改写会把用户刚打的字抹掉（morphdom 对 value 也是这么处理的）。
   */
  function syncAttrs(el, src) {
    var tag = el.tagName
    var editable = el === document.activeElement && (tag === 'INPUT' || tag === 'TEXTAREA')
    var i, a
    for (i = el.attributes.length - 1; i >= 0; i--) {
      a = el.attributes[i]
      if (editable && a.name === 'value') continue
      if (!src.hasAttribute(a.name)) el.removeAttribute(a.name)
    }
    for (i = 0; i < src.attributes.length; i++) {
      a = src.attributes[i]
      if (editable && a.name === 'value') continue
      if (tag === 'INPUT' && a.name === 'value') {
        // input 的 value 是「脏属性」：只改 attribute 不会刷新已输入过的框，必须走 property
        if (el.value !== a.value) el.value = a.value
        continue
      }
      if (el.getAttribute(a.name) !== a.value) el.setAttribute(a.name, a.value)
    }
  }

  /** 同标签就复用，返回 false 表示需要整节点替换 */
  function patchNode(oldN, newN) {
    if (newN.nodeType === 3) {
      if (oldN.nodeType !== 3) return false
      if (oldN.nodeValue !== newN.nodeValue) oldN.nodeValue = newN.nodeValue
      return true
    }
    if (newN.nodeType !== 1) return false
    if (oldN.nodeType !== 1 || oldN.tagName !== newN.tagName) return false
    syncAttrs(oldN, newN)
    patchChildren(oldN, newN)
    return true
  }

  function patchChildren(oldP, newP) {
    var oldKids = Array.prototype.slice.call(oldP.childNodes)
    var newKids = Array.prototype.slice.call(newP.childNodes)
    var i = 0
    for (; i < newKids.length; i++) {
      var o = oldKids[i]
      var n = newKids[i]
      if (!o) { oldP.appendChild(document.importNode(n, true)); continue }
      if (!patchNode(o, n)) oldP.replaceChild(document.importNode(n, true), o)
    }
    for (; i < oldKids.length; i++) oldP.removeChild(oldKids[i])
  }

  var morphBroken = false
  function morphMount(el, html) {
    if (morphBroken) { el.innerHTML = html; return }
    try {
      var tpl = document.createElement('template')
      tpl.innerHTML = html
      patchChildren(el, tpl.content)
    } catch (err) {
      // 补丁失败退回整块替换：宁可丢焦点，也不能让页面卡在旧画面上
      morphBroken = true
      el.innerHTML = html
      console.error('morph 失败，已退回整块替换:', err)
    }
  }

  // ── 样式注入 ──
  function styleTag(id, css) {
    var s = document.getElementById(id)
    if (!s) {
      s = document.createElement('style')
      s.id = id
      document.head.appendChild(s)
    }
    s.textContent = css
    return s
  }

  var BASE_CSS = [
    'view, scroll-view, swiper, picker, form, navigator, cover-view { display: block; }',
    'text { display: inline; }',
    'scroll-view { overflow: hidden; }',
    'scroll-view[scroll-x] { overflow-x: auto; overflow-y: hidden; }',
    'scroll-view[scroll-y] { overflow-y: auto; }',
    'img { display: block; max-width: 100%; }',
    'input { border: 0; outline: 0; background: transparent; font: inherit; color: inherit; width: 100%; padding: 0; }',
    // 微信的 <button> 是块级、默认占满整行；浏览器里它是 inline-block，会缩成文字宽，
    // 页面只写 .btn-primary（不给 width）时预览里就变成一个窄药丸，看着像布局坏了。
    // 必须限定在 #mount 内：预览外壳自己的工具条也用 button，全局改会把它一起撑满。
    '#mount button { font: inherit; display: block; width: 100%; margin: 0; }',
    'picker { cursor: pointer; }',
    'picker:active { background: rgba(0,0,0,.05); }',
    // 预览里 flex 行右侧的 picker/input 会缩成文字宽，点空白处没反应；
    // 真机 <picker> 本身会占满整行，这里给 preview 补上同等点击区域。
    '.form-item > picker, .form-item > input { flex: 1; text-align: right; }',
    '.wb-switch { display:inline-block; width:80rpx; height:46rpx; border-radius:23rpx; background:#D8D5CF;',
    '  position:relative; vertical-align:middle; transition:background .15s; cursor:pointer; }',
    '.wb-switch-on { background:#4E6B54; }',
    '.wb-switch i { position:absolute; top:4rpx; left:4rpx; width:38rpx; height:38rpx; border-radius:50%;',
    '  background:#fff; transition:left .15s; }',
    '.wb-switch-on i { left:38rpx; }'
  ].join('\n')

  // ── 启动 ──
  var runtime
  fetch('/__manifest')
    .then(function (r) { return r.json() })
    .then(function (manifest) {
      var files = manifest.files
      var root = manifest.root || 'miniprogram/'
      var W = window.WBPreview

      styleTag('wb-base-style', W.transformWxss(BASE_CSS))
      if (files[root + 'app.wxss']) {
        styleTag(
          'wb-app-style',
          W.transformWxss(files[root + 'app.wxss'], { fromPath: 'app.wxss', files: files, root: root })
        )
      }

      var uiHooks = {
        mount: function (html, events, inst) {
          morphMount(mount, html)
          currentInstance = inst
        },
        setTitle: function (t) { if (t) navTitle.textContent = t },
        setNav: function (info) {
          currentPath = info.path
          navPath.textContent = info.path.replace('pages/', '')
          navBack.style.visibility = info.canBack ? 'visible' : 'hidden'
          if (info.title) navTitle.textContent = info.title
          var pageWxss = files[root + info.path + '.wxss']
          styleTag(
            'wb-page-style',
            pageWxss
              ? W.transformWxss(pageWxss, { fromPath: info.path + '.wxss', files: files, root: root })
              : ''
          )
          pagePicker.value = info.path
          writeReport()
        },
        toast: toast,
        modal: showModal
      }

      runtime = W.createRuntime({
        files: files,
        mpBase: '/mp/',
        apiBase: 'http://127.0.0.1:8000/api/v1',
        log: log,
        ui: uiHooks
      })

      // 页面下拉
      runtime.appJson.pages.forEach(function (p) {
        var opt = document.createElement('option')
        opt.value = p
        opt.textContent = p.replace('pages/', '')
        pagePicker.appendChild(opt)
      })

      pagePicker.onchange = function () { window.__wb.goto(pagePicker.value) }
      document.getElementById('btn-reload').onclick = function () { window.__wb.goto(currentPath) }
      document.getElementById('btn-restart').onclick = function () { window.__wb.goto('pages/home/home') }
      document.getElementById('btn-flow').onclick = function () { window.__wb.flow() }
      navBack.onclick = function () { runtime.back() }
      document.getElementById('btn-logs').onclick = function () {
        var s = document.getElementById('sidebar')
        s.style.display = s.style.display === 'none' ? 'flex' : 'none'
      }

      log('清单载入：' + Object.keys(files).length + ' 个文本文件', 'info')

      // ── 自动化接口 ──
      // 供命令行探针（probe.js）与人工调试使用。所有动作都走页面真实的事件处理函数，
      // 不绕过任何业务逻辑 —— 否则预览就失去意义了。
      function q(sel) { return mount.querySelector(sel) }
      function handlerEl(name) { return mount.querySelector('[data-wb-h="' + name + '"]') }

      function clickEl(el) {
        if (!el) return false
        el.click()
        return true
      }

      function clickHandler(name) {
        var el = handlerEl(name)
        if (!el) return false
        if (el.tagName.toLowerCase() === 'picker') {
          el.click() // 由 harness 弹层接管，再调用 __pickConfirm
          return true
        }
        el.click()
        return true
      }

      /** 给 input 赋值并触发真实 bindinput */
      function typeHandler(name, value) {
        var el = handlerEl(name)
        if (!el) return false
        el.value = value
        el.dispatchEvent(new Event('input', { bubbles: true }))
        return true
      }

      /** 走真实的 picker 弹层：点开 → 填值 → 确定 */
      function pickHandler(name, value) {
        var el = handlerEl(name)
        if (!el) return false
        el.click()
        return new Promise(function (resolve) {
          setTimeout(function () {
            var input = document.getElementById('modal-body').querySelector('input,select')
            if (!input) { resolve(false); return }
            if (input.tagName === 'SELECT') {
              // 选择型：按文本或下标匹配
              var idx = Number(value)
              if (isNaN(idx)) {
                var opts = Array.prototype.slice.call(input.options)
                var hit = opts.filter(function (o) { return o.textContent.indexOf(String(value)) !== -1 })[0]
                input.value = hit ? hit.value : input.value
              } else {
                input.value = String(idx)
              }
            } else {
              input.value = value
            }
            document.getElementById('modal-ok').click()
            resolve(true)
          }, 30)
        })
      }

      function clickText(text) {
        var nodes = Array.prototype.slice.call(mount.querySelectorAll('[data-wb-ev]'))
        var hit = nodes.filter(function (el) { return (el.textContent || '').indexOf(text) !== -1 })[0]
        return clickEl(hit)
      }

      /** 等某个条件成立（页面切换 / 出现某元素 / 数据就绪） */
      function waitFor(predicate, timeoutMs) {
        var t0 = Date.now()
        return new Promise(function (resolve) {
          ;(function loop() {
            var ok = false
            try { ok = predicate() } catch (e) { ok = false }
            if (ok) return resolve(true)
            if (Date.now() - t0 > (timeoutMs || 15000)) return resolve(false)
            setTimeout(loop, 120)
          })()
        })
      }

      /**
       * 通用步骤执行器。每个步骤都是「等某元素出现 → 对它做一个真实动作」，
       * 动作全部走页面自己的事件处理函数，不绕过业务逻辑。
       * steps 里可用的键：
       *   wait:  处理器名（等它出现；可选 timeout 毫秒，默认 15000）
       *   type:  { sel, value }  给 input 赋值并触发 bindinput
       *   pick:  { sel, value }  走原生 picker 弹层
       *   click: 处理器名
       *   txt:   文本片段（点第一个含该文本的可点元素）
       *   sleep: 毫秒
       */
      function runSteps(steps) {
        return steps.reduce(function (chain, step) {
          return chain.then(function () {
            if (step.wait && !step.optional) {
              return waitFor(function () { return handlerEl(step.wait) }, step.timeout || 15000)
            }
            return true
          }).then(function () {
            if (step.type) return typeHandler(step.type.sel, step.type.value)
            if (step.pick) return pickHandler(step.pick.sel, step.pick.value)
            if (step.click) return clickHandler(step.click)
            if (step.txt) return clickText(step.txt)
            return true
          }).then(function () {
            return step.sleep ? new Promise(function (r) { setTimeout(r, step.sleep) }) : true
          })
        }, Promise.resolve(true))
      }

      /**
       * 跑通真实起名流程：资料页 → 定偏好 → 生成 → 结果页。
       * 之所以要做这个：结果页/详情页依赖 globalData.lastResult，
       * 直接下拉跳过去只会被 navigateBack 弹回，看不到真实内容。
       *
       * opts.path：
       *   'direct'（默认）    选个气质 → 直接生成
       *   'chars'            选个气质 → 先字后典 → 载入字表 → 点一个字 → 生成
       *   'sources'          选个气质 → 先典后字 → 选诗经 → 生成
       * chars/sources 两条会把「路径选择 → 硬约束真的生效」一并验掉。
       */
      function runFlow(opts) {
        opts = opts || {}
        var path = opts.path || 'direct'
        // 断言证据攒在这，最后一次性并入报告。
        // 注意 writeReport 是**整份替换**不是合并——中途单独调一次，
        // 会被后面那次 writeReport 覆盖掉，证据就没了（踩过）。
        var flowExtra = {}
        panelMark = panel.length
        log('[流程] 起名（' + path + '）：资料页 → 定偏好 → 生成', 'info')
        return startAt('pages/name/name').then(function () {
          var steps = [
            { wait: 'onSurnameInput' },
            { type: { sel: 'onSurnameInput', value: opts.surname || '林' } }
          ]
          // 八字默认关（日期是选填项），所以流程本身不需要填生日。
          // 要连八字一起跑时，改成「开开关 → 打开自绘弹层 → 直接用默认日期确定」——
          // 不再有原生 picker，`pick` 那套选择器填值的方式已经用不上了。
          if (opts.birthDate) {
            steps = steps.concat([
              { click: 'onBaziToggle' },
              { sleep: 300 },
              { wait: 'onOpenBirthDate' },
              { click: 'onOpenBirthDate' },
              { sleep: 400 },
              { click: 'onSheetConfirm' },
              { sleep: 300 }
            ])
          }
          steps = steps.concat([
            { click: 'onNext' },
            // 偏好页第一屏是三个标签区，先等「气质」区渲染出来
            { wait: 'onStyleTap' },
            { click: 'onStyleTap' }
          ])
          if (path === 'chars') {
            steps = steps.concat([
              { txt: '先字后典' },
              { sleep: 300 },
              // 字表要真的向后端算一遍（门槛感知可行性），给它时间
              { wait: 'onCharTap', timeout: 20000 },
              { sleep: 200 },
              { click: 'onCharTap' }
            ])
          } else if (path === 'sources') {
            steps = steps.concat([
              { txt: '先典后字' },
              { sleep: 300 },
              { wait: 'onSourceTap' },
              { txt: '诗经' }
            ])
          }
          steps = steps.concat([{ sleep: 200 }, { click: 'onSubmit' }])
          return runSteps(steps)
        }).then(function () {
          return waitFor(function () { return currentPath === 'pages/result/result' }, 30000)
        }).then(function (ok) {
          // 路径硬约束断言：从字出发时，结果里每个名字都必须含所点的字
          if (ok && path === 'chars') {
            var res = runtime.getApp().globalData.lastResult || {}
            var params = runtime.getApp().globalData.lastParams || {}
            var picked = params.selected_chars || []
            var bad = (res.names || []).filter(function (n) {
              return !picked.some(function (ch) { return n.given_name.indexOf(ch) !== -1 })
            })
            log('[流程] 先字约束：选了 ' + picked.join('/') + '，' +
              (res.names || []).length + ' 个名字里违约 ' + bad.length + ' 个',
              bad.length ? 'error' : 'info')
            if (bad.length) {
              log('[流程] 违约示例：' + bad.slice(0, 5).map(function (n) {
                return n.given_name
              }).join(' '), 'error')
            }
            flowExtra.flowPicked = picked
            flowExtra.flowViolations = bad.length
            if (bad.length) ok = false
          }
          if (ok && path === 'sources') {
            var res2 = runtime.getApp().globalData.lastResult || {}
            var wrong = {}
            ;(res2.names || []).forEach(function (n) {
              var src = (n.poetry || {}).source
              if (src && src !== '诗经') wrong[src] = (wrong[src] || 0) + 1
            })
            var badSrc = Object.keys(wrong)
            log('[流程] 先出处约束：非诗经出处 ' + badSrc.length + ' 种 ' +
              badSrc.join('/'), badSrc.length ? 'error' : 'info')
            flowExtra.flowSources = badSrc
            flowExtra.flowSourceNames = (res2.names || []).length
            if (badSrc.length) ok = false
          }
          if (opts.thenDetail) {
            log(ok ? '[流程] 再进一个名字的详情页' : '[流程] 未到结果页，跳过详情', ok ? 'info' : 'warn')
            if (ok) {
              return runSteps([{ wait: 'onNameTap' }, { click: 'onNameTap' }])
                .then(function () { return waitFor(function () { return currentPath === 'pages/detail/detail' }, 10000) })
                .then(function () { return true })
            }
          }
          return ok
        }).then(function (ok) {
          log(ok ? '[流程] 已到 ' + currentPath : '[流程] 未到结果页（后端没起？）', ok ? 'info' : 'error')
          flowExtra.flowDone = !!ok
          flowExtra.flowAt = currentPath
          writeReport(flowExtra)
          return !!ok
        }).catch(function (err) {
          log('[流程] 失败：' + err.message, 'error')
          writeReport({ flowDone: false, flowError: err.message })
          return false
        })
      }

      /** 孕期起名流程 → 停在 prenatal-result */
      function runPrenatalFlow() {
        panelMark = panel.length
        log('[流程] 孕期起名：未出生 → 预产期 → 生成', 'info')
        return startAt('pages/name/name?tab=prenatal').then(function () {
          return runSteps([
            // 预产期也是自绘弹层：点开 → 用默认日期（今天 +90 天）直接确定
            { wait: 'onOpenDueDate' },
            { click: 'onOpenDueDate' },
            { sleep: 400 },
            { click: 'onSheetConfirm' },
            { sleep: 200 },
            { click: 'onNext' },
            { wait: 'onStyleTap' },
            { click: 'onStyleTap' },
            { sleep: 200 },
            { click: 'onSubmit' }
          ])
        }).then(function () {
          return waitFor(function () { return currentPath === 'pages/prenatal-result/prenatal-result' }, 30000)
        }).then(function (ok) {
          log(ok ? '[流程] 已到 ' + currentPath : '[流程] 未到孕期结果页', ok ? 'info' : 'error')
          writeReport({ flowDone: !!ok, flowAt: currentPath })
          return !!ok
        })
      }

      /** 名字测评流程 → 停在 analyze-result */
      function runAnalyzeFlow() {
        panelMark = panel.length
        log('[流程] 名字测评：填姓名 → 开始测评', 'info')
        return startAt('pages/analyze/analyze').then(function () {
          return runSteps([
            { wait: 'onNameInput' },
            { type: { sel: 'onNameInput', value: '林海深' } },
            // 释名页的「补充生辰」默认关，不填生辰也能测评
            { sleep: 200 },
            { click: 'onSubmit' }
          ])
        }).then(function () {
          return waitFor(function () { return currentPath === 'pages/analyze-result/analyze-result' }, 30000)
        }).then(function (ok) {
          log(ok ? '[流程] 已到 ' + currentPath : '[流程] 未到测评结果页', ok ? 'info' : 'error')
          writeReport({ flowDone: !!ok, flowAt: currentPath })
          return !!ok
        })
      }

      function startAt(path) {
        runtime.stack = []
        runtime.navigate('/' + path.replace(/^\//, ''), 'reset')
        return new Promise(function (r) { setTimeout(r, 250) })
      }

      // ── 上下文补齐 ──
      // 结果页 / 详情页 / 八字页只从 globalData 取数据，直接跳过去会被
      // 页面自己的 navigateBack 弹回。这里先**走真实流程**把上下文准备好，
      // 而不是手塞一份假数据 —— 否则预览看到的就不是真实结果了。
      var NEED_CONTEXT = {
        'pages/result/result': 'lastResult',
        'pages/bazi/bazi': 'lastResult',
        'pages/detail/detail': 'selectedName',
        'pages/prenatal-result/prenatal-result': 'prenatalResult',
        'pages/analyze-result/analyze-result': 'analyzeResult'
      }

      function seedSelectedName() {
        var g = runtime.getApp().globalData
        if (g.lastResult && (g.lastResult.names || []).length) {
          g.selectedName = g.lastResult.names[0]
          if (!g.lastBatchId) g.lastBatchId = Date.now()
          log('[预览] 已把第一个候选名设为 selectedName（等价于点开第一张名字卡）', 'info')
        }
      }

      function ensureContext(path) {
        var need = NEED_CONTEXT[path]
        if (!need) return Promise.resolve(true)
        var g = runtime.getApp().globalData || {}
        if (g[need]) return Promise.resolve(true)

        if (need === 'lastResult' || need === 'selectedName') {
          if (!g.lastResult) {
            log('[预览] ' + path + ' 需要起名结果，先自动跑一遍起名流程', 'info')
            return runFlow().then(function (ok) {
              if (ok && need === 'selectedName') seedSelectedName()
              return ok
            })
          }
          if (need === 'selectedName') seedSelectedName()
          return Promise.resolve(true)
        }
        if (need === 'prenatalResult') return runPrenatalFlow()
        if (need === 'analyzeResult') return runAnalyzeFlow()
        return Promise.resolve(true)
      }

      window.__wb = {
        runtime: runtime,
        log: log,
        /** 把当前日志位置设为报告基线：之后的日志才算「这一次」的 */
        mark: function () { panelMark = panel.length },
        goto: function (path) {
          var clean = String(path).replace(/^\//, '').split('?')[0]
          return ensureContext(clean).then(function () {
            panelMark = panel.length
            runtime.stack = []
            runtime.navigate('/' + String(path).replace(/^\//, ''), 'reset')
            return true
          })
        },
        clickHandler: clickHandler,
        clickText: clickText,
        typeHandler: typeHandler,
        pickHandler: pickHandler,
        waitFor: waitFor,
        flow: runFlow,
        prenatalFlow: runPrenatalFlow,
        analyzeFlow: runAnalyzeFlow,
        runSteps: runSteps,
        /** 预设 wx.showModal 的答案：true=确定 / false=取消 / null=恢复真人点击 */
        setModalAnswer: function (v) { modalAnswer = v === undefined ? true : v },
        /** 名字本的落盘内容（本机存储替身里的真实数据，用于自检） */
        storage: function (key) { return runtime.debugStorage ? runtime.debugStorage(key) : null },
        panel: function () { return panel.slice() },
        report: function () { return JSON.parse(document.getElementById('wb-report').textContent || '{}') }
      }

      // 页面切换后报告里的 page 字段同步刷新
      var _setNav = uiHooks.setNav
      uiHooks.setNav = function (info) { _setNav(info); writeReport() }

      // ── 启动：支持 ?page=<路径> 与 ?flow=direct|chars|sources|prenatal|analyze|detail ──
      var params = new URLSearchParams(location.search)
      var startPage = params.get('page')
      var flow = params.get('flow')
      var flowOpts = {
        surname: params.get('surname') || undefined,
        birthDate: params.get('birth') || undefined,
        thenDetail: flow === 'detail',
        // 路径选择：先字（chars）/ 先出处（sources）会额外断言硬约束真的生效
        path: ['direct', 'chars', 'sources'].indexOf(flow) >= 0 ? flow : undefined
      }
      if (flow === 'prenatal') {
        runPrenatalFlow()
      } else if (flow === 'analyze') {
        runAnalyzeFlow()
      } else if (flow) {
        runFlow(flowOpts)
      } else if (startPage) {
        window.__wb.goto(startPage)
      } else {
        runtime.open('pages/home/home', {})
      }
      if (params.get('logs') === '0') {
        document.getElementById('sidebar').style.display = 'none'
      }
    })
    .catch(function (err) {
      log('启动失败：' + err.message, 'error')
      writeReport({ bootFailed: String(err && err.message) })
    })

  // ── 源码变更自动重载 ──
  //
  // 外壳在页面加载时把 miniprogram 的源码一次性拉进内存，之后切页面都读内存。
  // 改完文件而浏览器不重载，看到的就还是**旧页面** —— 表现成「点了没反应」
  // 「明明改了却没生效」，最容易把人带偏去查功能。这里轮询一个几十字节的签名，
  // 一变就重载；开发期「改完即见」比保住当前操作状态重要。
  var bootSig = null
  function pollSig() {
    fetch('/__sig', { cache: 'no-store' })
      .then(function (r) { return r.json() })
      .then(function (d) {
        if (!d || !d.sig) return
        if (!bootSig) { bootSig = d.sig; return }
        if (d.sig !== bootSig) {
          console.log('[preview] 源码已变更，自动重载 …')
          location.reload()
        }
      })
      .catch(function () {})
  }
  pollSig()
  setInterval(pollSig, 2000)
})()
</script>
</body>
</html>
